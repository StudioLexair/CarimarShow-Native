name: Build Android and Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure Android signing secrets in this repository.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/carimarshow.p12"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/carimarshow.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - name: Verify signature and bundled interface
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/index.html"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/catalog-snapshot.json"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/modules/views-home.mjs"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/modules/services-orders.mjs"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/modules/ui-orders.mjs"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/modules/services-platform.mjs"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/app/styles.css"
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/CarimarShow-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/CarimarShow-Android.aab
          cd artifacts && sha256sum * > SHA256-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CarimarShow-Android
          path: artifacts/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CarimarShow ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES-${{ github.ref_name }}.md
          draft: true
          make_latest: true
          files: artifacts/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        run: dotnet publish windows/CarimarShow.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Download offline WebView2 runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile artifacts/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          $signature = Get-AuthenticodeSignature artifacts/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --no-progress -y }
          & $compiler windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $file = 'artifacts/CarimarShow-Windows-x64-Setup.exe'
          (Get-FileHash $file -Algorithm SHA256).Hash + '  CarimarShow-Windows-x64-Setup.exe' | Set-Content artifacts/SHA256-Windows.txt
      - name: Smoke-test installed offline app startup
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'CarimarShow-Smoke'
          $installer = (Resolve-Path 'artifacts/CarimarShow-Windows-x64-Setup.exe').Path
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "CarimarShow installer exited with $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'CarimarShow.exe'
          if (!(Test-Path $exe) -or !(Test-Path (Join-Path $installDir 'web/app/index.html'))) { throw 'Installed offline payload is incomplete' }
          $diagnosticFile = Join-Path $env:RUNNER_TEMP 'CarimarShow-startup-diagnostic.txt'
          $env:CARIMARSHOW_STARTUP_LOG = $diagnosticFile
          $startedAt = Get-Date
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "Desktop process exit code: $($app.ExitCode)"
            if (Test-Path $diagnosticFile) { Write-Host 'Startup exception:'; Get-Content $diagnosticFile }
            $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') -and $_.Message -match 'CarimarShow|WebView2|CoreWebView2' } |
              Select-Object -First 5
            foreach ($event in $events) { Write-Host "$($event.ProviderName): $($event.Message.Substring(0, [Math]::Min(2000, $event.Message.Length)))" }
            throw 'Installed desktop app exited during WebView2 initialization'
          }
          if (!(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)) { throw 'WebView2 renderer did not start' }
          Stop-Process -Id $app.Id -Force
          Write-Host 'PASS: installer completed; offline web payload and WebView2 app process started.'
      - uses: actions/upload-artifact@v4
        with:
          name: CarimarShow-Windows-x64
          path: |
            artifacts/CarimarShow-Windows-x64-Setup.exe
            artifacts/SHA256-Windows.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CarimarShow ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES-${{ github.ref_name }}.md
          draft: true
          make_latest: true
          files: |
            artifacts/CarimarShow-Windows-x64-Setup.exe
            artifacts/SHA256-Windows.txt
