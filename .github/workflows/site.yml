name: Deploy web to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'api/**', 'lib/**', 'scripts/check.mjs', 'tests/unit.mjs', 'vercel.json', 'package.json', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check && npm test
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          # CLI 63 supports project-scoped tokens without reading unrelated team settings.
          npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN"
          node <<'NODE'
          const fs = require('node:fs');
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            const {VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID} = process.env;
            const headers = {Authorization: `Bearer ${VERCEL_TOKEN}`, 'Content-Type': 'application/json'};
            const query = new URLSearchParams({teamId: VERCEL_ORG_ID});
            const projectResponse = await fetch(`https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${query}`, {headers});
            if (!projectResponse.ok) throw Error(`Project verification: HTTP ${projectResponse.status}`);
            const project = await projectResponse.json();
            if (project.id !== VERCEL_PROJECT_ID || project.name !== 'carimarshow') throw Error('Unexpected project');
            const deployment = project.targets?.production?.id;
            if (!deployment) throw Error('Missing production deployment');

            const expectedShell = fs.readFileSync('public/app/sw.js', 'utf8').match(/const SHELL = "([^"]+)"/)?.[1];
            if (!expectedShell) throw Error('Missing expected service-worker revision');
            let actualShell = '';
            for (let attempt = 0; attempt < 10 && actualShell !== expectedShell; attempt++) {
              const check = await fetch(`https://carimarshow.vercel.app/app/sw.js?verify=${Date.now()}`, {cache: 'no-store'});
              if (check.ok) actualShell = (await check.text()).match(/const SHELL = "([^"]+)"/)?.[1] || '';
              if (actualShell !== expectedShell) await delay(3000);
            }
            if (actualShell !== expectedShell) throw Error('Production alias does not serve the deployed shell revision');

            const viewer = await fetch(`https://carimarshow.vercel.app/app/modules/ui-lightbox.mjs?verify=${Date.now()}`, {cache: 'no-store'});
            if (!viewer.ok || !(await viewer.text()).includes('cachedImage(imageKey)'))
              throw Error('Production alias does not serve the offline image viewer');
            console.log(`Verified production deployment ${deployment}: https://carimarshow.vercel.app (${expectedShell})`);
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
